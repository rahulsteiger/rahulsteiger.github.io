<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610" role="img" aria-labelledby="title desc">
<title id="title">Output reconstruction from features to RGB video</title>
<desc id="desc">Starting with 189 by 360 by 640 features with 512 channels, residual blocks reduce channels to 256. RMS normalization and SiLU preserve the shape. A causal 3 by 3 by 3 convolution produces 12 channels per position. Unpacking these into 2 by 2 RGB patches yields 189 frames of 720 by 1280 pixels with 3 channels.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#738297"/></marker></defs>
<rect width="640" height="610" rx="14" fill="#fafbfd"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#233247">
<text x="320" y="30" font-size="17" fill="#617187">Time × height × width × channels</text>
<text x="320" y="66" font-size="21">Input: 189 × 360 × 640 × 512</text>
<path d="M320 79 V100" stroke="#738297" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="70" y="106" width="500" height="94" rx="10" fill="#edf3f9" stroke="#b4c8db"/>
<text x="320" y="132" font-size="22">3 residual blocks</text>
<text x="320" y="158" font-size="17" fill="#617187">Reduce channels from 512 to 256</text>
<text x="320" y="185" font-size="21" fill="#315f84">189 × 360 × 640 × 256</text>
<path d="M320 200 V224" fill="none" stroke="#738297" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="70" y="224" width="500" height="94" rx="10" fill="#edf3f9" stroke="#b4c8db"/>
<text x="320" y="250" font-size="22">RMS normalization + SiLU</text>
<text x="320" y="276" font-size="17" fill="#617187">Normalize and activate features</text>
<text x="320" y="303" font-size="21" fill="#315f84">189 × 360 × 640 × 256</text>
<path d="M320 318 V342" stroke="#738297" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="70" y="342" width="500" height="94" rx="10" fill="#edf3f9" stroke="#b4c8db"/>
<text x="320" y="368" font-size="22">3 × 3 × 3 causal Conv3D</text>
<text x="320" y="394" font-size="17" fill="#617187">Predict 4 RGB pixels per position</text>
<text x="320" y="421" font-size="21" fill="#315f84">189 × 360 × 640 × 12</text>
<path d="M320 436 V460" stroke="#738297" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="70" y="460" width="500" height="94" rx="10" fill="#edf5e8" stroke="#b6cfa7"/>
<text x="320" y="486" font-size="22">Unpack 2 × 2 patches</text>
<text x="320" y="512" font-size="17" fill="#617187">Rearrange 12 channels → 4 pixels × RGB</text>
<text x="320" y="539" font-size="21" fill="#42682e">189 × 720 × 1280 × 3</text>
<text x="320" y="589" font-size="17" fill="#617187">189 time steps throughout. Only unpacking enlarges the grid.</text></g></svg>
