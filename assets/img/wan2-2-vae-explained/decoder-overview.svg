<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 32 640 602" role="img" aria-labelledby="title desc">
<title id="title">Wan2.2 VAE decoder overview</title>
<desc id="desc">The main decoder stages expand 48 by 45 by 80 latents with 48 channels into 189 RGB frames at 720 by 1280. Each stage shows its output shape. The middle block preserves shape.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#738297" stroke-width="1.3"/></marker></defs>
<rect y="32" width="640" height="602" rx="16" fill="#fafbfd"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#233247">
<text x="320" y="68" font-size="17" fill="#617187" text-anchor="middle">Output shapes: time × height × width × channels</text>
<rect x="80" y="94" width="480" height="66" rx="9" fill="white" stroke="#d7e1eb" stroke-width="1.3"/>
<text x="320" y="119" font-size="20" fill="#233247" text-anchor="middle">Video latents</text>
<text x="320" y="144" font-size="21" fill="#315f84" text-anchor="middle">48 × 45 × 80 × 48</text>
<path d="M320 162 V180" stroke="#738297" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80" y="184" width="480" height="66" rx="9" fill="white" stroke="#d7e1eb" stroke-width="1.3"/>
<text x="320" y="209" font-size="20" fill="#233247" text-anchor="middle">Input projection + Conv3D</text>
<text x="320" y="234" font-size="21" fill="#315f84" text-anchor="middle">48 × 45 × 80 × 1024</text>
<path d="M320 252 V270" stroke="#738297" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80" y="274" width="480" height="66" rx="9" fill="#f1ebf8" stroke="#bba7d4" stroke-width="1.3"/>
<text x="320" y="299" font-size="20" fill="#233247" text-anchor="middle">Residual Blocks + Spatial Attention</text>
<text x="320" y="324" font-size="21" fill="#705095" text-anchor="middle">48 × 45 × 80 × 1024</text>
<path d="M320 342 V360" stroke="#738297" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80" y="364" width="480" height="96" rx="9" fill="#edf3f9" stroke="#b4c8db" stroke-width="1.3"/>
<text x="320" y="389" font-size="20" text-anchor="middle">Temporal + Spatial Upsampling</text>
<text x="320" y="415" font-size="17" fill="#617187" text-anchor="middle">Two time + space stages, then one space-only stage</text>
<text x="320" y="444" font-size="21" fill="#315f84" text-anchor="middle">189 × 360 × 640 × 512</text>
<path d="M320 462 V480" stroke="#738297" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80" y="484" width="480" height="96" rx="9" fill="#edf5e8" stroke="#b6cfa7" stroke-width="1.3"/>
<text x="320" y="509" font-size="20" text-anchor="middle">Output reconstruction</text>
<text x="320" y="535" font-size="17" fill="#617187" text-anchor="middle">Residual blocks → output head → unpack patches</text>
<text x="320" y="564" font-size="21" fill="#42682e" text-anchor="middle">189 × 720 × 1280 × 3</text>
<text x="320" y="615" font-size="16" fill="#617187" text-anchor="middle">Batch omitted. Shapes describe the full sequence.</text>

</g></svg>
