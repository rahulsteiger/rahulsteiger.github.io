<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 246" role="img" aria-labelledby="title desc">
<title id="title">Two input channels become one spatial patch</title>
<desc id="desc">At one spatial position, input channels contain a and b. Repeating and rearranging these values produces one output channel with a in both cells of the top row and b in both cells of the bottom row of a two-by-two patch.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#738297"/></marker>
</defs>
<rect width="560" height="246" rx="14" fill="#fafbfd"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#233247">
<text x="120" y="32" font-size="20">One input position</text>
<text x="120" y="57" font-size="16" fill="#617187">Two channel values</text>
<text x="430" y="32" font-size="20">Four output positions</text>
<text x="430" y="57" font-size="16" fill="#617187">One channel · 2 × 2 patch</text>
<rect x="62" y="70" width="116" height="144" rx="10" fill="none" stroke="#a8b5c5" stroke-dasharray="4 3"/>
<rect x="92" y="80" width="56" height="56" rx="7" fill="#f1ebf8" stroke="#bba7d4"/>
<rect x="92" y="148" width="56" height="56" rx="7" fill="#edf5e8" stroke="#b6cfa7"/>
<text x="120" y="116" font-size="26" fill="#705095">a</text>
<text x="120" y="184" font-size="26" fill="#42682e">b</text>
<path d="M180 142 H336" fill="none" stroke="#738297" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="258" y="126" font-size="16" fill="#617187">Repeat + reshape</text>
<rect x="368" y="80" width="62" height="62" fill="#f1ebf8" stroke="#bba7d4"/>
<rect x="430" y="80" width="62" height="62" fill="#f1ebf8" stroke="#bba7d4"/>
<rect x="368" y="142" width="62" height="62" fill="#edf5e8" stroke="#b6cfa7"/>
<rect x="430" y="142" width="62" height="62" fill="#edf5e8" stroke="#b6cfa7"/>
<g font-size="26">
<text x="399" y="120" fill="#705095">a</text><text x="461" y="120" fill="#705095">a</text>
<text x="399" y="182" fill="#42682e">b</text><text x="461" y="182" fill="#42682e">b</text>
</g>
</g>
</svg>
